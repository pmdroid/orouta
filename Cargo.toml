[package]
name = "orouta"
version = "0.1.0"
edition = "2021"
description = "Route Ollama-compatible requests to hosts by model name"
readme = "README.md"
homepage = "https://orouta.dev"
repository = "https://github.com/pmdroid/orouta"

[dependencies]
axum = "0.8"
bytes = "1"
futures-util = "0.3"
http-body-util = "0.1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
subtle = "2"
tokio = { version = "1", features = ["full"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
wiremock = "0.6"
